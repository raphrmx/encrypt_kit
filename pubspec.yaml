name: encrypt_kit
version: 6.0.1
description: >-
  Maintained, audited successor of the `encrypt` package: high-level APIs over
  PointyCastle 4 for AES, ChaCha20-Poly1305, RSA, Salsa20, Fernet and signing.
repository: https://github.com/raphrmx/encrypt_kit
issue_tracker: https://github.com/raphrmx/encrypt_kit/issues
topics:
  - encryption
  - cryptography
  - aes
  - rsa
  - security

executables:
  secure-random:

environment:
  sdk: ^3.5.0

dependencies:
  args: ^2.7.0
  asn1lib: ^1.6.8
  clock: ^1.1.3
  pointycastle: ^4.0.0

dev_dependencies:
  test: ^1.26.3
  very_good_analysis: ^7.0.0

false_secrets:
  - /test/*.pem
  - /test/fixtures/keys.dart
