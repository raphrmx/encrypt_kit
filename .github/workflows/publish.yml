# Publishes to pub.dev when a tag like v6.0.1 is pushed.
# Requires automated publishing to be enabled on pub.dev for this repository
# (Admin tab, tag pattern "v{{version}}"). The very first release must be
# published manually with `dart pub publish`.
name: Publish to pub.dev

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+*'

jobs:
  publish:
    permissions:
      id-token: write
    uses: dart-lang/setup-dart/.github/workflows/publish.yml@v1
